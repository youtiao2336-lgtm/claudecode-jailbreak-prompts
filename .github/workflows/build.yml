name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and verify
        shell: powershell
        run: .\build.ps1 -Target All -Verify

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: claude-code-prompt-manager-windows
          path: |
            ccprompt-gui.exe
            ccprompt.exe
            prompts/
            inject/
            README.md
            README.en.md
            README.ja.md
            README.fr.md
            README.ru.md
            gui-screenshot.png
            gui-screenshot.en.png
            gui-screenshot.ja.png
            gui-screenshot.fr.png
            gui-screenshot.ru.png
            SOURCES.md
            CONTRIBUTORS.md
            LICENSE
            CHANGELOG.md
