name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and verify
        shell: powershell
        run: .\build.ps1 -Target All -Verify

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: ccprompt-windows
          path: |
            ccprompt-gui.exe
            ccprompt.exe
            prompts/
            inject/
            README.md
            CHANGELOG.md

